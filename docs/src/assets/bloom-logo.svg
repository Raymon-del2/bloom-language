<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bloomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Seed/Circle base -->
  <circle cx="50" cy="60" r="15" fill="url(#bloomGrad)" filter="url(#glow)"/>
  
  <!-- Sprout stem -->
  <path d="M50 45 Q50 35 50 30" stroke="url(#bloomGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Left leaf -->
  <path d="M50 35 Q35 25 30 35 Q35 40 50 35" fill="#10b981" opacity="0.9"/>
  
  <!-- Right leaf -->
  <path d="M50 35 Q65 20 70 32 Q65 38 50 35" fill="#06b6d4" opacity="0.9"/>
  
  <!-- Small top leaf -->
  <ellipse cx="50" cy="28" rx="4" ry="6" fill="#8b5cf6" opacity="0.8"/>
  
  <!-- Pulse rings -->
  <circle cx="50" cy="60" r="20" stroke="#10b981" stroke-width="0.5" fill="none" opacity="0.3"/>
  <circle cx="50" cy="60" r="25" stroke="#06b6d4" stroke-width="0.5" fill="none" opacity="0.2"/>
</svg>
