[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bloom-framework"
version = "0.1.3"
description = "Bloom - The Local-First AI Engine CLI"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["bloom", "local-first", "ai", "framework", "cli"]
authors = [
  { name = "Bloom Team", email = "team@bloom.dev" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "click>=8.0.0",
  "rich>=13.0.0",
  "pydantic>=2.0.0",
]

[project.scripts]
bloom = "bloom_seed.cli:main"
bloom-seed = "bloom_seed.cli:seed"
bloom-init = "bloom_seed.cli:init"
bloom-grow = "bloom_seed.cli:grow"
bloom-crystalize = "bloom_seed.cli:crystalize"

[project.urls]
Homepage = "https://bloom-language.vercel.app"
Repository = "https://github.com/Raymon-del2/bloom-language"
Documentation = "https://bloom-language.vercel.app"
Issues = "https://github.com/Raymon-del2/bloom-language/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bloom_seed"]
